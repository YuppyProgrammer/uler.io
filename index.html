<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>uler.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-wrap">
    <canvas id="game" width="1200" height="700"></canvas>

    <section id="menu-overlay" class="overlay">
      <div class="panel menu-panel">
        <div class="menu-kicker">SIMPLE GAME</div>
        <h1>uler<span>.io</span></h1>
        <p class="menu-intro">Tumbuh lebih panjang. Jangan sentuh batas.</p>

        <div class="score-card">
          <span>REKOR TERTINGGI</span>
          <strong id="menu-high-score">0</strong>
        </div>

        <div class="control-grid">
          <div class="control-card">
            <strong class="control-icon">⌘</strong>
            <div>
              <b>Keyboard</b>
              <span>WASD / Panah untuk bergerak</span>
            </div>
          </div>
          <div class="control-card">
            <strong class="control-icon">◉</strong>
            <div>
              <b>Layar sentuh</b>
              <span>Geser joystick dan tahan BOOST</span>
            </div>
          </div>
        </div>

        <button id="start-btn"><span>MULAI PERMAINAN</span><small>ENTER / SPASI</small></button>
        <p class="menu-tip">Kumpulkan power-up untuk bertahan lebih lama</p>
      </div>
    </section>

    <section id="pause-overlay" class="overlay hidden">
      <div class="panel">
        <h2>GAME DI-PAUSE</h2>
        <button id="resume-btn">Lanjutkan Game</button>
        <button id="pause-restart-btn">Restart Game</button>
        <button id="main-menu-btn">Kembali ke Menu Utama</button>
        <p class="muted">ESC / P = lanjutkan</p>
      </div>
    </section>

    <section id="gameover-overlay" class="overlay hidden">
      <div class="panel">
        <h2>GAME OVER</h2>
        <p id="final-score"></p>
        <p id="new-high-score"></p>
        <p class="muted">Tekan ENTER untuk main lagi</p>
        <button id="gameover-restart-btn">Main Lagi</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
